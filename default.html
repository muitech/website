<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }} — Muitech Digital</title>
  <meta name="description" content="{{ page.description | default: 'Muitech Digital — ICT & Digital Media Solutions, Port Moresby, Papua New Guinea.' }}"/>
  <meta name="author" content="Mellah Kilangit"/>
  <meta property="og:title" content="{{ page.title }} — Muitech Digital"/>
  <meta property="og:description" content="{{ page.description | default: 'End-to-end ICT & Digital Solutions for Papua New Guinea.' }}"/>
  <meta property="og:url" content="https://www.muitech.net{{ page.url }}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="https://www.muitech.net/og-image.png"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <meta name="theme-color" content="#080808"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Oxanium:wght@300;400;500;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>

{% include nav.html %}
{% include mobile-menu.html %}

<main>
  {{ content }}
</main>

{% include footer.html %}

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) {
        setTimeout(() => e.target.classList.add('visible'), i * 80);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
